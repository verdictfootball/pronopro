name: JPL Scraper Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Afhankelijkheden installeren
        run: npm install axios cheerio @supabase/supabase-js

      - name: Scraper uitvoeren
        run: node scraper.js

